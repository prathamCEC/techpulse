
name: TechPulse Daily Briefing

on:
  schedule:
    - cron: "14 19 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore subscriber data
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          data = os.environ.get("SUBSCRIBERS_JSON", "").strip()

          if not data:
              raise RuntimeError("SUBSCRIBERS_JSON secret is missing")

          path = Path("bot/subscribers.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(data, encoding="utf-8")

          print("Subscriber data restored successfully.")
          PY

      - name: Generate and send briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          TIMEZONE: Asia/Kolkata
          NEWS_LIMIT: "10"
        run: |
          python -m scripts.send_daily_briefing
